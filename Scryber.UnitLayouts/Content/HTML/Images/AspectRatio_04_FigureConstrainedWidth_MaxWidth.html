<html xmlns="http://www.w3.org/1999/xhtml" >
    <head>
        <title>Image Aspect Ratio - figure-constrained width, with max-width:100% (the responsive-image fix)</title>
        <style>
            @page{
                size: 600pt 800pt;
                margin : 0;
            }
            body{ margin: 0; padding: 0; }
        </style>
    </head>
    <body>
    <figure style="width: 22.34%;">
        <img src="../../Images/Toroid32.png" class="image_resized" style="aspect-ratio: 602/614; max-width: 100%;" width="602" height="614" />
    </figure>
    </body>

</html>
