<html xmlns='http://www.w3.org/1999/xhtml'>
<head><style>
@page { size: 400pt 300pt; margin: 0; } html{width:400pt} body { margin: 0; font-family: Helvetica, sans-serif; font-size: 12pt; }
td { padding: 2pt; }
</style></head>
<body>
<div style='position: relative; height: 300pt;'>
  <div id='flex' style='position: absolute; left: 10pt; top: 10pt;'><div style='display: flex; gap: 6pt;'><div id='flexA'>one</div><div id='flexB'>two two</div></div></div>
  <div id='table' style='position: absolute; left: 10pt; top: 60pt;'><table style='border-collapse: collapse;'><tr><td>a cell</td><td>another cell</td></tr></table></div>
  <div id='list' style='position: absolute; left: 10pt; top: 120pt;'><ul id='listUl' style='margin: 0'><li id='listA'>first item</li><li id='listB'>a second item</li></ul></div>
  <div id='centred' style='position: absolute; left: 10pt; top: 180pt; text-align: center;'><div id='centredA'>centred</div><div id='centredB'>a longer centred line</div></div>
  <div id='nested' style='position: absolute; left: 200pt; top: 10pt;'><div style='padding: 0 5pt;'><div id='nestedInner' style='padding: 0 5pt;'>nested blocks</div></div></div>
</div>
</body>
</html>
