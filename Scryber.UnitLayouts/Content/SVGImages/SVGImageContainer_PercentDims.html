<html xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title>SVG images with percentage width and/or height on the SVG element</title>
        <style>
            body { padding: 5pt; }
            img { border: 1px solid black; background-color: lightyellow; }
            p { margin: 0; margin-bottom: 5pt; }
        </style>
    </head>
    <body>
        <!-- vb 0 0 200 150, width=150% → no size of its own (as a browser), fills the width with the 4:3 viewBox ratio -->
        <img id="pct_width_only" src="Sample_PercentWidth_ViewBox200x150.svg" />
        <p>width=150% - fills the width, height from the viewBox ratio</p>

        <!-- vb 0 0 200 150, height=50% → no size of its own, fills the width (reduced to fit the rest of the page) -->
        <img id="pct_height_only" src="Sample_PercentHeight_ViewBox200x150.svg" />
        <p>height=50% - fills the width, reduced to fit the page, keeping the viewBox ratio</p>

<!-- vb 0 0 200 150, width=75% height=100% → fills the width with the viewBox ratio -->
        <img id="pct_both_nonsquare" src="Sample_PercentBoth_ViewBox200x150.svg" />
        <p>width=75%, height=100% - fills the width, height from the viewBox ratio</p>

<!-- vb 0 0 200 150, width=50%, img width=400pt → 400×300 from the viewBox ratio -->
        <img id="pct_width_img_override" src="Sample_PercentWidth_ImgOverride_ViewBox200x150.svg" style="width:400pt" />
        <p>SVG width=50%, img width=400pt - 400×300</p>
    </body>
</html>
