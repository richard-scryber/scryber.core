# Read the Docs: the Scryber docs have moved to paperwork.help.
# No Sphinx build: copy two static pages that send every old address to the new site.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  commands:
    - mkdir -p $READTHEDOCS_OUTPUT/html
    - cp docs/redirect/index.html docs/redirect/404.html $READTHEDOCS_OUTPUT/html/
